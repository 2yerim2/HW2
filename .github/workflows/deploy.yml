name: Deploy published Docker image

on:
  workflow_run:
    workflows: ["Build and publish Docker image"]
    types: [completed]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/health-monitor
  CONTAINER_NAME: health-monitor
  HOST_PORT: "8000"

jobs:
  deploy:
    # The registered Windows self-hosted runner must have Docker Desktop/Engine running.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 15

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the image published by CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "${env:IMAGE_NAME}:${{ github.event.workflow_run.head_sha }}"
          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw "Could not pull $image" }
          "IMAGE=$image" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Replace local container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = docker ps -aq --filter "name=^${env:CONTAINER_NAME}$"
          if ($old) {
            docker rm -f $env:CONTAINER_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the existing container' }
          }

          docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Could not start the new container' }

      - name: Verify service and model endpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "http://127.0.0.1:${env:HOST_PORT}/api/health"
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-RestMethod -Uri $url -TimeoutSec 3
              if ($response.ok -eq $true) {
                Write-Host ("Health response: " + ($response | ConvertTo-Json -Compress))
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $healthy) {
            docker logs $env:CONTAINER_NAME
            throw "Service did not become healthy at $url"
          }

      - name: Show container logs on failure
        if: ${{ failure() }}
        shell: pwsh
        run: docker logs $env:CONTAINER_NAME
