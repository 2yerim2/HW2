name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  # Pull requests do not expose repository secrets, so use a local-only tag there.
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/health-monitor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run fixed synthetic evaluation
        shell: bash
        run: |
          python3 evaluation/generate_dataset.py
          python3 evaluation/evaluate.py

      - name: Run API contract validation
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 evaluation/validate_api.py

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
