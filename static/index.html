<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>건강 리스크 모니터</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><p class="eyebrow">PRIVATE HEALTH MONITOR</p><h1>오늘의 건강 체크인</h1><p class="muted">날짜별 생활 지표를 기록하고 패턴을 확인하세요.</p></div><div class="badge">로컬 전용 · 데이터는 이 컴퓨터에만 저장</div></header>
<section class="grid"><div class="card form-card"><label>기록 날짜<input id="day" type="date"></label><div class="fields"><label>수면량 (시간)<input id="sleep" type="number" min="0" max="24" step="0.1" placeholder="7.5"></label><label>운동 시간 (시간)<input id="exercise" type="number" min="0" max="24" step="0.1" placeholder="0.5"></label><label>스트레스 정도 (0~10)<input id="stress" type="number" min="0" max="10" step="1" placeholder="3"></label><label>물 섭취량 (리터)<input id="water" type="number" min="0" max="20" step="0.1" placeholder="1.5"></label></div><button id="save">기록 저장 및 분석</button><p id="error" class="error"></p></div><div class="card result-card"><div class="score-row"><div><p class="eyebrow">HEALTH SCORE</p><h2 id="score">—<small>/100</small></h2></div><span id="label" class="status">기록을 선택하세요</span></div><h3>AI 건강상태 분석</h3><p id="analysis" class="analysis">날짜를 선택하고 지표를 입력하면 분석 결과가 나타납니다.</p><p class="disclaimer">⚕ 이 결과는 의학적 진단이 아닙니다. 증상이나 우려가 있으면 의료 전문가와 상담하세요.</p></div></section>
<section class="card insight-card"><p class="eyebrow">RECENT 3 DAYS</p><h3>최근 3일 인사이트</h3><p id="insight">최근 3일 기록을 입력하면 생활 패턴 기반 인사이트가 표시됩니다.</p></section></main><script src="/static/app.js"></script></body></html>
